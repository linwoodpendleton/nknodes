<h1>把服务器运维集中到一个面板</h1>
<p>自己维护服务器的人都知道,真正耗时间的不是某一件具体的事,而是工具之间的缝隙:证书要单独续、备份要单独配、网络要单独理,出了问题还要在好几个面板之间来回切换。</p>
<p>NodeKeeper(NK)的思路是把这一层整合起来:自托管基础设施管理平台,把网站托管、虚拟机、云电脑、Ceph 分布式存储和跨地域组网放进同一个管理面板。独立系统用户和资源限制实现多租户隔离;节点多了以后,Ceph 自动部署、快照、高可用管理,一套工具链支撑私有云落地。一个面板替代十个工具,这就是 NK 的价值。</p>
